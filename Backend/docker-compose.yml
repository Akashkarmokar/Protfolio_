services:
  mongodb_db:
    container_name: ${APP_NAME}_mongo_db
    image: mongo:latest
    restart: always
    volumes:
      - protfolio_mongodb_db:/data/db
    ports:
      - '27017:27017'
    logging: 
      driver: 'none'
  
