  backend_api:
    build: .
    container_name: ${APP_NAME}_backend_container
    ports:
      - 3000:3000
    volumes:
      - .:/project
      - /project/node_modules
    environment:
      - SERVERLESS_ACCESS_KEY=${SERVERLESS_ACCESS_KEY}
      - db_connection_string=mongodb://mongodb_db:27017/${APP_NAME}
      - db_connection_string_for_TDD=mongodb://mongodb_db_TDD:27018/${APP_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    command: npx nodemon --legacy-watch --exec "sls offline --host 0.0.0.0"  # Use nodemon for hot reloading
    depends_on:
      - mongodb_db


volumes:
  protfolio_mongodb_db:
